name: Publish Brilliant UI

on:
  push:
    tags:
      - '@brilliantmode/ui@*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-brilliant-ui
  cancel-in-progress: false

jobs:
  publish:
    name: Publish @brilliantmode/ui
    if: startsWith(github.ref, 'refs/tags/@brilliantmode/ui@')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout release
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Setup npm for trusted publishing
        run: npm install --global npm@11.19.1

      - name: Verify release tag
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('packages/components/package.json', 'utf8'));
          if (process.env.GITHUB_REF_NAME !== `${pkg.name}@${pkg.version}`) {
            throw new Error('Release tag must match the package name and version.');
          }
          JS

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check and build release
        run: pnpm check

      - name: Verify generated MCP artifacts are committed
        run: |
          pnpm --filter @brilliantmode/ui generate
          git diff --exit-code -- packages/components/src/mcp/catalog.ts packages/components/src/mcp/guides.ts

      - name: Publish to npm using trusted publishing
        working-directory: packages/components
        run: npm publish --access public --provenance

      - name: Verify published version
        working-directory: packages/components
        run: |
          version=$(node -p 'require("./package.json").version')
          npm view "@brilliantmode/ui@$version" version dist.integrity
