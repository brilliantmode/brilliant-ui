name: Publish Brilliant UI

on:
  push:
    tags:
      - '@brilliantmode/ui@*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to verify or publish
        required: true
        type: string
      verify_only:
        description: Verify an already published release without publishing again
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: publish-brilliant-ui
  cancel-in-progress: false

jobs:
  publish:
    name: Publish @brilliantmode/ui
    if: startsWith(github.ref, 'refs/tags/@brilliantmode/ui@') || (github.event_name == 'workflow_dispatch' && startsWith(inputs.tag, '@brilliantmode/ui@'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout release
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Setup npm for trusted publishing
        run: npm install --global npm@11.19.1

      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('packages/components/package.json', 'utf8'));
          if (process.env.RELEASE_TAG !== `${pkg.name}@${pkg.version}`) {
            throw new Error('Release tag must match the package name and version.');
          }
          JS

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check and build release
        run: pnpm check

      - name: Verify generated MCP artifacts are committed
        run: |
          pnpm --filter @brilliantmode/ui generate
          git diff --exit-code -- packages/components/src/mcp/catalog.ts packages/components/src/mcp/guides.ts

      - name: Publish to npm using trusted publishing
        if: github.event_name == 'push' || !inputs.verify_only
        working-directory: packages/components
        run: npm publish --access public --provenance

      - name: Verify published version
        working-directory: packages/components
        run: |
          version=$(node -p 'require("./package.json").version')
          for attempt in {1..20}; do
            if npm view "@brilliantmode/ui@$version" version dist.integrity; then
              exit 0
            fi
            echo "Waiting for npm registry processing (attempt $attempt/20)..."
            sleep 15
          done
          echo "Published version is still unavailable after five minutes."
          exit 1
